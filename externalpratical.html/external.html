<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container{
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 40px;
            border: 2px solid black;
            width: 90%;
  }

       .card {
           width: 250px;
            background: white;
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
   }

   .circle {
    
            width: 80px;
            height: 80px;
            background: dodgerblue;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            margin: auto;
            margin-bottom: 15px;
   }

   .name{
     font-size:20px;
     font-weight: bold;
     margin : 5px ;

   }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
             <div class="circle">PP</div>
              <div class="name">Priyanshi Panwar</div>
              <p>Btech - CSE </p>
              <p>Roll No - 25032011000</p>
              <p>1st Year</p>
        </div>
        <div class="card">
            <div class="circle">PS</div>
              <div class="name">Palak Sharma</div>
              <p>Btech - CSE </p>
              <p>Roll No - 25032011067</p>
              <p>1st Year</p>
        </div>
        <div class="card">
            <div class="circle">PR</div>
              <div class="name">Priyanka Rathi</div>
              <p>Btech - CSE </p>
              <p>Roll No - 25032010099</p>
              <p>1st Year</p>
        </div>
    </div>
</body>
</html>
